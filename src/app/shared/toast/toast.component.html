<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl border shadow-xl backdrop-blur-md transition-all fade-in"
      [ngClass]="{
        'bg-emerald-950/80 border-emerald-500/30 text-emerald-100': toast.type === 'success',
        'bg-rose-950/80 border-rose-500/30 text-rose-100': toast.type === 'error',
        'bg-amber-950/80 border-amber-500/30 text-amber-100': toast.type === 'warn',
        'bg-sky-950/80 border-sky-500/30 text-sky-100': toast.type === 'info'
      }">
      
      <span class="material-symbols-outlined text-lg flex-shrink-0 mt-0.5"
        [ngClass]="{
          'text-emerald-400': toast.type === 'success',
          'text-rose-400': toast.type === 'error',
          'text-amber-400': toast.type === 'warn',
          'text-sky-400': toast.type === 'info'
        }">
        @switch (toast.type) {
          @case ('success') { check_circle }
          @case ('error') { error }
          @case ('warn') { warning }
          @case ('info') { info }
        }
      </span>

      <div class="flex-1 min-w-0">
        <h4 class="text-xs font-bold tracking-tight">{{ toast.title }}</h4>
        @if (toast.message) {
          <p class="text-xs opacity-85 mt-0.5 leading-relaxed">{{ toast.message }}</p>
        }
      </div>

      <button 
        type="button" 
        (click)="toastService.remove(toast.id)"
        class="text-xs opacity-60 hover:opacity-100 p-0.5 transition-opacity">
        <span class="material-symbols-outlined text-sm">close</span>
      </button>
    </div>
  }
</div>
